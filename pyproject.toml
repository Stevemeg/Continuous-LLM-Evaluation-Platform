[project]
name = "clep"
version = "0.1.0"
description = "Continuous LLM Evaluation & Regression Testing Platform — core evaluation harness"
requires-python = ">=3.11"

# Every dependency here is either named in the canonical technology baseline or
# required by an accepted ADR. The justification for each, and the reason for
# each rejected alternative, is in docs/dependencies.md — REQ-N-MAINT-5 requires
# a reason, not a lockfile.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL and Redis (docker compose up -d)",
]

[tool.coverage.run]
source = ["clep"]
branch = true

[tool.coverage.report]
# REQ-N-MAINT-4. The gate is on the harness the phase delivers.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
