[project]
name = "clep"
version = "0.1.0"
description = "Continuous LLM Evaluation & Regression Testing Platform — core evaluation harness"
requires-python = ">=3.11"

# Proprietary, all rights reserved. Stated here as well as in LICENSE because
# package metadata travels with an installed distribution and LICENSE does not:
# `pip show clep` in a deployed environment would otherwise report no licence at
# all, which reads as unstated rather than reserved. The table form is used
# rather than a bare SPDX string because the SPDX form requires setuptools 77,
# and the build requirement below is 68 — declaring one and requiring the other
# is how a build breaks on somebody else's machine.
license = { text = "Proprietary - All Rights Reserved. See LICENSE." }
classifiers = ["License :: Other/Proprietary License"]

# Every dependency here is either named in the canonical technology baseline or
# required by an accepted ADR. The justification for each, and the reason for
# each rejected alternative, is in docs/dependencies.md — REQ-N-MAINT-5 requires
# a reason, not a lockfile.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "redis>=5.0",
]

# Canonical §11: a CLI suitable for GitHub Actions and other CI systems. The
# console script is the whole distribution surface; argparse is standard
# library, so this adds no dependency.
[project.scripts]
clep = "clep.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL and Redis (docker compose up -d)",
]

[tool.coverage.run]
source = ["clep"]
branch = true

[tool.coverage.report]
# REQ-N-MAINT-4. The gate is on the harness the phase delivers.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
